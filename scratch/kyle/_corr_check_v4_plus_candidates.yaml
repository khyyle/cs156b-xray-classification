run_name: _corr_check_v4_plus_candidates
model_class: radiology_cls.models.ensemble.EnsembleModel

# Throwaway ensemble for the candidate-correlation gate. Adding the three
# completed candidates (SigLIP 2, OmniRad, per-class ASL) on top of v4
# so train() caches their val preds; we then run investigate_ensemble_errors
# with --focus-member on each to compute its mean residual correlation
# against the existing 15 v4 members. Not intended for LB submission.

combiner: mean
weights: null

