[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radiology-cls"
version = "0.1.0"
description = "Shared code for CS156B."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch==2.6.0",
    "torchvision==0.21.0",
    "pillow==12.1.1",
    "pandas==2.2.3",
    "numpy==2.4.3",
    "scikit-learn==1.6.1",
    "matplotlib==3.10.1",
    "tqdm==4.67.1",
    "pyyaml==6.0.2",
    "wandb==0.26.0",
    "grad-cam==1.5.5",
    "timm==1.0.26",
    "python-dotenv==1.2.3",
    "nbstripout==0.9.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
mypy_path = "src"

# After `pip install -e .`, install the CUDA-matched torch separately:
#   pip install torch==2.6.0 torchvision==0.21.0 --force-reinstall --index-url https://download.pytorch.org/whl/cu124
