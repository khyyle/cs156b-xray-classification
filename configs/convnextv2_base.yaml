run_name: convnextv2-base-pretrained
model_class: radiology_cls.models.timm_cnn.TimmCNNModel
architecture: convnextv2_base
pretrained: true
image_size: 256
batch_size: 64
lr: 1.0e-4
epochs: 10
dropout_prob: 0.1
drop_path_rate: 0.1
loss_type: mse
weight_decay: 5.0e-2
scheduler: cosine
min_lr: 1.0e-6
warmup_epochs: 1
seed: 42
val_frac: 0.1
num_workers: 8
